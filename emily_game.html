<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>איצוב דמיות - סימולטור</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#ff8fd8,#9fd3ff);
    text-align:center;
}

h1{
    color:white;
    text-shadow:2px 2px 5px black;
}

.panel{
    background:white;
    width:90%;
    max-width:900px;
    margin:auto;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

.character{
    margin:auto;
    width:220px;
}

.hair{
    width:120px;
    height:80px;
    background:brown;
    margin:auto;
    border-radius:60px 60px 20px 20px;
}

.face{
    width:110px;
    height:110px;
    background:#ffd9b3;
    border-radius:50%;
    margin:auto;
    position:relative;
}

.eye{
    width:15px;
    height:15px;
    background:black;
    border-radius:50%;
    position:absolute;
    top:35px;
}

.left{right:25px;}
.right{left:25px;}

.mouth{
    width:40px;
    height:10px;
    border-bottom:3px solid black;
    position:absolute;
    bottom:25px;
    left:35px;
}

.body{
    width:120px;
    height:140px;
    background:#4CAF50;
    margin:auto;
    border-radius:20px;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:10px;
    background:#ff4da6;
    color:white;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}

.money{
    font-size:22px;
    color:gold;
    font-weight:bold;
}
</style>
</head>
<body>

<h1>🎨 איצוב דמיות - סימולטור 🎨</h1>

<div class="panel">

<div class="money">
💰 מטבעות: <span id="coins">100</span>
</div>

<br>

<div class="character">

<div id="hair" class="hair"></div>

<div class="face">
<div id="eye1" class="eye left"></div>
<div id="eye2" class="eye right"></div>
<div class="mouth"></div>
</div>

<div id="body" class="body"></div>

</div>

<h2>בחירת דמות</h2>

<button onclick="boy()">👦 בן</button>
<button onclick="girl()">👧 בת</button>

<h2>עיצוב</h2>

<button onclick="hairColor()">💇 צבע שיער</button>
<button onclick="shirtColor()">👕 צבע חולצה</button>
<button onclick="eyeColor()">👀 צבע עיניים</button>

<h2>חנות</h2>

<button onclick="buyGoldenHair()">⭐ שיער זהב (20)</button>
<button onclick="buyRainbowShirt()">🌈 חולצת קשת (30)</button>

<h2>פעולות</h2>

<button onclick="randomCharacter()">🎲 דמות אקראית</button>
<button onclick="saveCharacter()">💾 שמירה</button>
<button onclick="loadCharacter()">📂 טעינה</button>

<p id="status"></p>

</div>

<script>

let coins = 100;

function updateCoins(){
document.getElementById("coins").innerText=coins;
}

function boy(){
hair.style.height="70px";
status.innerText="נבחר בן";
}

function girl(){
hair.style.height="110px";
status.innerText="נבחרה בת";
}

function randomColor(){
return "#"+Math.floor(Math.random()*16777215).toString(16);
}

function hairColor(){
hair.style.background=randomColor();
}

function shirtColor(){
body.style.background=randomColor();
}

function eyeColor(){
let c=randomColor();
eye1.style.background=c;
eye2.style.background=c;
}

function buyGoldenHair(){
if(coins>=20){
coins-=20;
updateCoins();
hair.style.background="gold";
status.innerText="קנית שיער זהב!";
}else{
status.innerText="אין מספיק מטבעות";
}
}

function buyRainbowShirt(){
if(coins>=30){
coins-=30;
updateCoins();
body.style.background=
"linear-gradient(red,orange,yellow,green,blue,purple)";
status.innerText="קנית חולצת קשת!";
}else{
status.innerText="אין מספיק מטבעות";
}
}

function randomCharacter(){
hair.style.background=randomColor();
body.style.background=randomColor();

let c=randomColor();
eye1.style.background=c;
eye2.style.background=c;
}

function saveCharacter(){

let data={
hair:hair.style.background,
shirt:body.style.background,
eye:eye1.style.background,
coins:coins
};

localStorage.setItem(
"character",
JSON.stringify(data)
);

status.innerText="נשמר!";
}

function loadCharacter(){

let data=
JSON.parse(
localStorage.getItem("character")
);

if(!data) return;

hair.style.background=data.hair;
body.style.background=data.shirt;
eye1.style.background=data.eye;
eye2.style.background=data.eye;

coins=data.coins;
updateCoins();

status.innerText="נטען!";
}

updateCoins();

</script>

</body>
</html>
