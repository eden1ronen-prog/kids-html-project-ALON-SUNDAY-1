<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>משחק זומבים אימוג'ים</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(#1b1b2f, #16213e);
      color: white;
      user-select: none;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(#293462 0%, #1b1b2f 65%, #235347 65%, #18392b 100%);
    }

    #ground {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 35%;
      background: linear-gradient(#2f6b4f, #1f4534);
      border-top: 6px solid #5aa469;
    }

    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 4px black;
    }

    #instructions {
      position: absolute;
      top: 55px;
      right: 15px;
      z-index: 10;
      font-size: 16px;
      background: rgba(0, 0, 0, 0.35);
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.7;
    }

    .character {
      position: absolute;
      font-size: 48px;
      width: 55px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s;
    }

    #player {
      z-index: 5;
    }

    .enemy {
      z-index: 4;
    }

    .sword {
      position: absolute;
      font-size: 42px;
      z-index: 6;
      pointer-events: none;
      animation: slash 0.18s linear;
    }

    @keyframes slash {
      from { transform: rotate(-50deg) scale(0.7); opacity: 0.5; }
      to { transform: rotate(35deg) scale(1.2); opacity: 1; }
    }

    #message {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(0, 0, 0, 0.65);
      text-align: center;
      padding: 20px;
    }

    #message h1 {
      font-size: 48px;
      margin: 0 0 15px;
    }

    #message p {
      font-size: 22px;
      margin: 10px 0;
    }

    #message button {
      margin-top: 20px;
      font-size: 22px;
      padding: 12px 25px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      background: #ffd166;
      color: #222;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="ground"></div>

    <div id="hud">
      <div id="hearts">❤️❤️❤️</div>
      <div>שלב: <span id="level">1</span></div>
      <div>ניקוד: <span id="score">0</span></div>
    </div>

    <div id="instructions">
      ⬅️➡️ לזוז<br>
      ⬆️ או רווח לקפוץ<br>
      E לתקוף עם חרב ⚔️
    </div>

    <div id="player" class="character">🧍‍♂️</div>

    <div id="message">
      <h1>🧟 משחק הזומבים</h1>
      <p>תחסל את כל הזומבים כדי לעבור שלב!</p>
      <p>כל שלב מוסיף עוד אויבים.</p>
      <button onclick="startGame()">התחל משחק</button>
    </div>
  </div>

  <script>
    const game = document.getElementById("game");
    const playerEl = document.getElementById("player");
    const heartsEl = document.getElementById("hearts");
    const levelEl = document.getElementById("level");
    const scoreEl = document.getElementById("score");
    const messageEl = document.getElementById("message");

    const groundY = () => window.innerHeight * 0.65 - 55;

    let player;
    let enemies = [];
    let keys = {};
    let score = 0;
    let level = 1;
    let lives = 3;
    let gameRunning = false;
    let attackCooldown = false;
    let hurtCooldown = false;

    function resetPlayer() {
      player = {
        x: 100,
        y: groundY(),
        width: 55,
        height: 55,
        vx: 0,
        vy: 0,
        speed: 5,
        jumpPower: 15,
        onGround: true,
        facing: 1
      };
    }

    function startGame() {
      score = 0;
      level = 1;
      lives = 3;
      gameRunning = true;
      messageEl.style.display = "none";
      resetPlayer();
      removeAllEnemies();
      spawnLevel();
      updateHud();
      requestAnimationFrame(gameLoop);
    }

    function removeAllEnemies() {
      enemies.forEach(enemy => enemy.el.remove());
      enemies = [];
    }

    function spawnLevel() {
      removeAllEnemies();
      const amount = level + 2;

      for (let i = 0; i < amount; i++) {
        const el = document.createElement("div");
        el.className = "character enemy";
        el.textContent = "🧟";
        game.appendChild(el);

        enemies.push({
          x: 350 + Math.random() * (window.innerWidth - 450),
          y: groundY(),
          width: 55,
          height: 55,
          speed: 1.1 + level * 0.15 + Math.random() * 0.6,
          el
        });
      }
    }

    function updateHud() {
      heartsEl.textContent = "❤️".repeat(lives) + "🖤".repeat(3 - lives);
      levelEl.textContent = level;
      scoreEl.textContent = score;
    }

    document.addEventListener("keydown", (e) => {
      keys[e.key] = true;

      if ((e.key === " " || e.key === "ArrowUp") && player && player.onGround && gameRunning) {
        player.vy = -player.jumpPower;
        player.onGround = false;
      }

      if ((e.key === "e" || e.key === "E" || e.key === "ק") && gameRunning) {
        attack();
      }
    });

    document.addEventListener("keyup", (e) => {
      keys[e.key] = false;
    });

    function attack() {
      if (attackCooldown) return;
      attackCooldown = true;

      const sword = document.createElement("div");
      sword.className = "sword";
      sword.textContent = "⚔️";
      sword.style.left = player.x + player.facing * 45 + "px";
      sword.style.top = player.y + 5 + "px";
      game.appendChild(sword);

      const attackBox = {
        x: player.facing === 1 ? player.x + 35 : player.x - 70,
        y: player.y - 10,
        width: 100,
        height: 80
      };

      enemies.forEach((enemy, index) => {
        if (isColliding(attackBox, enemy)) {
          enemy.el.remove();
          enemies.splice(index, 1);
          score += 10;
          updateHud();
        }
      });

      setTimeout(() => sword.remove(), 180);
      setTimeout(() => attackCooldown = false, 350);
    }

    function isColliding(a, b) {
      return a.x < b.x + b.width &&
             a.x + a.width > b.x &&
             a.y < b.y + b.height &&
             a.y + a.height > b.y;
    }

    function playerHit() {
      if (hurtCooldown) return;
      hurtCooldown = true;
      lives--;
      updateHud();

      playerEl.style.filter = "brightness(2)";
      setTimeout(() => playerEl.style.filter = "none", 200);

      if (lives <= 0) {
        endGame();
      }

      setTimeout(() => hurtCooldown = false, 900);
    }

    function endGame() {
      gameRunning = false;
      messageEl.style.display = "flex";
      messageEl.innerHTML = `
        <h1>💀 הפסדת!</h1>
        <p>הניקוד שלך: ${score}</p>
        <p>הגעת לשלב: ${level}</p>
        <button onclick="startGame()">שחק שוב</button>
      `;
    }

    function nextLevel() {
      level++;
      score += 25;
      updateHud();
      resetPlayer();
      spawnLevel();
    }

    function updatePlayer() {
      player.vx = 0;

      if (keys["ArrowLeft"]) {
        player.vx = -player.speed;
        player.facing = -1;
      }

      if (keys["ArrowRight"]) {
        player.vx = player.speed;
        player.facing = 1;
      }

      player.x += player.vx;
      player.y += player.vy;
      player.vy += 0.75;

      if (player.y >= groundY()) {
        player.y = groundY();
        player.vy = 0;
        player.onGround = true;
      }

      player.x = Math.max(0, Math.min(window.innerWidth - player.width, player.x));

      playerEl.style.left = player.x + "px";
      playerEl.style.top = player.y + "px";
      playerEl.style.transform = `scaleX(${player.facing})`;
    }

    function updateEnemies() {
      enemies.forEach(enemy => {
        if (enemy.x < player.x) enemy.x += enemy.speed;
        if (enemy.x > player.x) enemy.x -= enemy.speed;

        enemy.el.style.left = enemy.x + "px";
        enemy.el.style.top = enemy.y + "px";

        if (isColliding(player, enemy)) {
          playerHit();
        }
      });
    }

    function gameLoop() {
      if (!gameRunning) return;

      updatePlayer();
      updateEnemies();

      if (enemies.length === 0) {
        nextLevel();
      }

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("resize", () => {
      if (!player) return;
      player.y = groundY();
      enemies.forEach(enemy => enemy.y = groundY());
    });
  </script>
</body>
</html>
